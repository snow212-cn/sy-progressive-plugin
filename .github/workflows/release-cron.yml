name: Build and Release

on:
  schedule:
    - cron: "17 0,12 * * 1,4"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-progressive
  cancel-in-progress: false

env:
  UPSTREAM_REPO: IAliceBobI/sy-progressive-plugin

jobs:
  release:
    name: Sync upstream, apply patches, build and release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch files
        uses: actions/checkout@v4
        with:
          sparse-checkout: patches
          sparse-checkout-cone-mode: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync, validate patches, build and release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          package_version=$(curl --fail --silent --show-error --retry 3 \
            "https://raw.githubusercontent.com/$UPSTREAM_REPO/refs/heads/main/plugin.json" | jq -r '.version')

          if [[ -z "$package_version" || "$package_version" == "null" ]]; then
            echo "::error::Unable to read upstream plugin.json version."
            exit 1
          fi

          release_tag="v$package_version"
          echo "Upstream version: $release_tag"

          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $release_tag already exists. Nothing to build."
            exit 0
          fi

          git clone --depth=1 --filter=blob:none \
            "https://github.com/$UPSTREAM_REPO.git" upstream

          cd upstream

          for patch in \
            "$GITHUB_WORKSPACE/patches/user.patch" \
            "$GITHUB_WORKSPACE/patches/Settings.patch" \
            "$GITHUB_WORKSPACE/patches/IndexConf.patch"
          do
            echo "Checking $(basename "$patch")..."
            if ! git apply --check --ignore-whitespace "$patch"; then
              echo "::error file=$patch::Patch no longer applies cleanly to upstream main."
              echo "Update the patch before publishing a new build."
              exit 1
            fi
            git apply --ignore-whitespace "$patch"
          done

          git diff --check

          npm ci --prefix sy-tomato-plugin
          npm ci --prefix sy-progressive-plugin
          npm run build --prefix sy-progressive-plugin

          cd sy-progressive-plugin
          rm -rf package
          mkdir -p package/sy-progressive-plugin
          cp -a build/. package/sy-progressive-plugin/
          cd package
          zip -qr ../package.zip sy-progressive-plugin

          gh release create "$release_tag" \
            package.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$release_tag" \
            --notes "Automated build from $UPSTREAM_REPO."
