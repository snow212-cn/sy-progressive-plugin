name: Build and Release

on:
  schedule:
    - cron: "17 0,12 * * 1,4"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-progressive
  cancel-in-progress: false

env:
  UPSTREAM_REPO: IAliceBobI/sy-progressive-plugin

jobs:
  release:
    name: Sync upstream, apply patches, build and release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch files
        uses: actions/checkout@v4
        with:
          sparse-checkout: patches
          sparse-checkout-cone-mode: true

      - name: Sync, validate patches, build and release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          package_version=$(curl --fail --silent --show-error --retry 3 \
            "https://raw.githubusercontent.com/$UPSTREAM_REPO/refs/heads/main/plugin.json" | jq -r '.version')

          if [[ -z "$package_version" || "$package_version" == "null" ]]; then
            echo "::error::Unable to read upstream plugin.json version."
            exit 1
          fi

          release_tag="v$package_version"
          echo "Upstream version: $release_tag"

          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $release_tag already exists. Nothing to build."
            exit 0
          fi

          git clone --depth=1 --filter=blob:none \
            "https://github.com/$UPSTREAM_REPO.git" upstream

          cd upstream
          
          # 上游部分文件使用 CRLF，而 patch 使用 LF。
          # git apply 不会自动把 CRLF/LF 上下文差异视为相同，因此先统一相关文件换行。
          sed -i 's/\r$//' sy-tomato-plugin/src/libs/user.ts
          sed -i 's/\r$//' sy-progressive-plugin/src/Settings.svelte
          
          for patch in \
            "$GITHUB_WORKSPACE/patches/user.patch" \
            "$GITHUB_WORKSPACE/patches/Settings.patch"
          do
            echo "Checking $(basename "$patch")..."
            if ! output=$(git apply --check --ignore-whitespace --unidiff-zero "$patch" 2>&1); then
              echo "$output"
              if grep -q "corrupt patch" <<< "$output"; then
                echo "::error file=$patch::Patch file is malformed."
              else
                echo "::error file=$patch::Patch does not apply to the current upstream source."
              fi
              exit 1
            fi
            git apply --ignore-whitespace --unidiff-zero "$patch"
          done

          git diff --check

      - name: Setup Node.js and restore npm cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            upstream/sy-tomato-plugin/package-lock.json
            upstream/sy-progressive-plugin/package-lock.json

      - name: Install dependencies in parallel
        shell: bash
        working-directory: upstream
        run: |
          set -euo pipefail

          npm install --prefix sy-tomato-plugin --no-audit --no-fund &
          tomato_pid=$!

          npm install --prefix sy-progressive-plugin --no-audit --no-fund &
          progressive_pid=$!

          status=0
          wait "$tomato_pid" || status=$?
          wait "$progressive_pid" || status=$?

          exit "$status"

      - name: Build progressive plugin
        shell: bash
        working-directory: upstream
        run: npm run build --prefix sy-progressive-plugin

      - name: Package and publish
        shell: bash
        working-directory: upstream/sy-progressive-plugin
        run: |
          set -euo pipefail

          rm -rf package
          mkdir -p package/sy-progressive-plugin
          cp -a build/. package/sy-progressive-plugin/
          cd package
          zip -qr package.zip sy-progressive-plugin

          gh release create "$release_tag" \
            package.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$release_tag" \
            --notes "Automated build from $UPSTREAM_REPO."
          rm -rf package
          mkdir -p package/sy-progressive-plugin
          cp -a build/. package/sy-progressive-plugin/
          cd package
          zip -qr package.zip sy-progressive-plugin
